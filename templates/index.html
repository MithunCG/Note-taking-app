<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iNotes - Take your notes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: #f8f9fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      nav.navbar {
        box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
      }

      .container {
        flex-grow: 1;
        padding-top: 2rem;
        padding-bottom: 4rem;
      }

      h1, h2 {
        color: #2c3e50;
        font-weight: 700;
      }

      form {
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 0 15px rgb(0 0 0 / 0.05);
        max-width: 600px;
        margin-bottom: 3rem;
      }

      .card {
        border-radius: 12px;
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.1);
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.15);
      }

      .badge-important {
        background: #ff6b6b;
        color: white;
        font-weight: 600;
        font-size: 0.85rem;
        padding: 0.4em 0.7em;
        border-radius: 0.75rem;
      }

      /* Style for important checkbox */
      .form-check-input:checked {
        border-color: #dc3545;
        background-color: #dc3545;
      }

      button.btn-primary {
        background-color: #2c3e50;
        border-color: #2c3e50;
        font-weight: 600;
        padding: 0.5rem 1.5rem;
        border-radius: 8px;
        transition: background-color 0.3s ease;
      }

      button.btn-primary:hover {
        background-color: #1a2733;
        border-color: #1a2733;
      }

      /* Search box styling */
      form.d-flex input.form-control {
        border-radius: 20px 0 0 20px;
        border-right: none;
      }

      form.d-flex button {
        border-radius: 0 20px 20px 0;
        border-left: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-3 text-primary" href="#">iNotes</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-between"
          id="navbarSupportedContent"
        >
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 fs-5">
            <li class="nav-item">
              <a class="nav-link active fw-semibold" aria-current="page" href="#"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link fw-semibold" href="#">About</a>
            </li>
            <!-- <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item" href="#">Something else here</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a
                class="nav-link disabled"
                aria-disabled="true"
                >Disabled</a
              >
            </li> -->
          </ul>
          <!-- <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search notes..."
              aria-label="Search"
            />
            <button class="btn btn-outline-primary" type="submit">
              Search
            </button>
          </form> -->
        </div>
      </div>
    </nav>

    <div class="container">
      <h1 class="mb-4">Start adding your note to the database</h1>
      <form action="/" method="post">
        <div class="mb-3">
          <label for="title" class="form-label fw-semibold">Note Title</label>
          <input
            type="text"
            class="form-control"
            name="title"
            id="title"
            placeholder="Enter your note title"
            required
          />
        </div>

        <div class="mb-3">
          <label for="desc" class="form-label fw-semibold">Note Description</label>
          <textarea
            class="form-control"
            name="desc"
            id="desc"
            rows="3"
            placeholder="Describe your note here..."
            required
          ></textarea>
        </div>

        <div class="mb-4 form-check">
          <input
            type="checkbox"
            class="form-check-input"
            name="important"
            id="important"
          />
          <label class="form-check-label fw-semibold" for="important">
            Mark as Important
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          Submit
        </button>
      </form>
    </div>

    <div class="container">
      <h2 class="mb-4">Your Notes</h2>

      {% if newDocs %}
      <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for item in newDocs %}
        <div class="col">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title text-truncate" title="{{ item.title }}">
                {{ item.title }}
              </h5>
              <p class="card-text">{{ item.desc }}</p>
              {% if item.important %}
              <span class="badge badge-important">Important</span>
              {% endif %}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="text-muted fst-italic">No Notes to Display</p>
      {% endif %}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
